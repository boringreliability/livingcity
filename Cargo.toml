[workspace]
resolver = "2"
members = ["crates/sim-core"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

# `t % n == 0` reads naturally for tick schedules; keep it.
[workspace.lints.clippy]
manual_is_multiple_of = "allow"

[profile.release]
debug = 1

# Simulation tests run many thousands of ticks; keep them fast.
[profile.test]
opt-level = 2
