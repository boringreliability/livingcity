# Machine-checked "Must NOT" rules for the simulation core (model contract):
# no transcendental float functions (native ≡ WASM bit-for-bit), no hash
# containers (iteration order), no wall clock. `sqrt` is correctly rounded
# by IEEE 754 and therefore allowed.
disallowed-methods = [
    { path = "f64::exp", reason = "transcendental: not bit-identical across platforms" },
    { path = "f64::exp2", reason = "transcendental" },
    { path = "f64::ln", reason = "transcendental" },
    { path = "f64::log", reason = "transcendental" },
    { path = "f64::log2", reason = "transcendental" },
    { path = "f64::log10", reason = "transcendental" },
    { path = "f64::powf", reason = "transcendental" },
    { path = "f64::powi", reason = "not guaranteed correctly rounded" },
    { path = "f64::sin", reason = "transcendental" },
    { path = "f64::cos", reason = "transcendental" },
    { path = "f64::tan", reason = "transcendental" },
    { path = "f64::atan2", reason = "transcendental" },
    { path = "f64::hypot", reason = "not guaranteed correctly rounded" },
    { path = "f64::exp_m1", reason = "transcendental" },
    { path = "f64::ln_1p", reason = "transcendental" },
    { path = "f64::cbrt", reason = "not guaranteed correctly rounded" },
    { path = "f64::asin", reason = "transcendental" },
    { path = "f64::acos", reason = "transcendental" },
    { path = "f64::atan", reason = "transcendental" },
    { path = "f64::sin_cos", reason = "transcendental" },
    { path = "f64::sinh", reason = "transcendental" },
    { path = "f64::cosh", reason = "transcendental" },
    { path = "f64::tanh", reason = "transcendental" },
    { path = "f64::asinh", reason = "transcendental" },
    { path = "f64::acosh", reason = "transcendental" },
    { path = "f64::atanh", reason = "transcendental" },
    { path = "f32::exp", reason = "transcendental" },
    { path = "f32::ln", reason = "transcendental" },
    { path = "f32::powf", reason = "transcendental" },
    { path = "f32::powi", reason = "not guaranteed correctly rounded" },
    { path = "f32::sin", reason = "transcendental" },
    { path = "f32::cos", reason = "transcendental" },
    { path = "f32::tan", reason = "transcendental" },
    { path = "std::time::Instant::now", reason = "no wall clock in the simulation" },
    { path = "std::time::SystemTime::now", reason = "no wall clock in the simulation" },
]
disallowed-types = [
    { path = "std::collections::HashMap", reason = "iteration order is nondeterministic" },
    { path = "std::collections::HashSet", reason = "iteration order is nondeterministic" },
]
