name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.93.0
  WASM_PACK: 0.13.1
  PNPM: 11.10.0
  NODE: 24

jobs:
  rust:
    name: Rust (clippy, tests debug + release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # debug: overflow checks; the calibration tests are skipped here
      - run: cargo test --workspace
      # release: everything, incl. calibration and the golden state hashes (polish_005_perf)
      - run: cargo test --workspace --release

  web:
    name: Web (wasm, typecheck, Vitest, build)
    runs-on: ubuntu-latest
    timeout-minutes: 60 # the junction sweep (motion002 3b-ci) alone can take 10+ min here
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
          components: rustfmt # Vitest's rust_sources_are_formatted runs rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@${{ env.WASM_PACK }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile
      - run: pnpm -C web build:wasm
      - run: pnpm -C web typecheck
      - run: pnpm -C web test
      - run: pnpm -C web build
      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: web/src/wasm
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: web/dist
          include-hidden-files: true # nothing hidden today; _headers has no dot, kept explicit
          retention-days: 7

  e2e:
    name: E2E (Playwright, SwiftShader)
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: wasm
          path: web/src/wasm
      - run: pnpm -C web exec playwright install --with-deps chromium
      - run: pnpm -C web e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: web/test-results
          retention-days: 7

  deploy:
    name: Deploy (Cloudflare Pages)
    needs: [rust, web, e2e]
    # manual only (Actions → CI → Run workflow on main): a green push must not deploy unless the user says so
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Skip without Cloudflare credentials
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; skipping the deploy."
      - if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE }}
      - if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: >
          npx --yes wrangler@4 pages deploy dist
          --project-name livingcity --branch main
          --commit-hash "${{ github.sha }}" --commit-dirty=false
